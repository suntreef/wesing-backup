name: Build exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许 GITHUB_TOKEN 上传 Release 资产
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyinstaller
      - run: pyinstaller --onefile --noconsole --name KG-Backup --icon assets/icon.ico --version-file version_info.txt --add-data "static;static" kg_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: KG-Backup-Windows
          path: dist/KG-Backup.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KG-Backup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
