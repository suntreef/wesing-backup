services:
  wesing-backup:
    build: .
    # 也可直接用发布镜像：
    # image: ghcr.io/suntreef/wesing-backup:latest
    container_name: wesing-backup
    ports:
      - "8765:8765"    # 工具页（管理）
      - "8766:8766"    # 盲盒页（分享给朋友）
    volumes:
      - "./backups:/data"
    environment:
      - TZ=Asia/Shanghai   # 容器默认 UTC，不设时区掉落日期/消息时间会差 8 小时
    restart: unless-stopped
